<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géoparc du Kef</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        /* ANCHOR: Indispensable pour que la carte soit visible */
        #map {
            height: 600px;
            width: 100%;
            margin-top: 10px;
        }
        .controls {
            margin: 10px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
        }
        button.inactive {
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="controls">
    <button onclick="toggleLayer(geologie, this)" class="active">🟥 Géologique</button>
    <button onclick="toggleLayer(minier, this)" class="active">🟦 Minier</button>
    <button onclick="toggleLayer(historique, this)" class="active">🟨 Historique</button>
    <button onclick="toggleLayer(naturel, this)" class="active">🟩 Naturel</button>
    <button onclick="toggleLayer(ethno, this)" class="active">🟫 Ethno</button>
    <button onclick="toggleLayer(gastronomie, this)" class="active">🟪 Gastro</button>
</div>

<!-- Div de la carte -->
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ================= MAP =================
var map = L.map('map').setView([36.17, 8.70], 9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// ================= LAYERS =================
var geologie = L.layerGroup().addTo(map);
var minier = L.layerGroup().addTo(map);
var historique = L.layerGroup().addTo(map);
var naturel = L.layerGroup().addTo(map);
var ethno = L.layerGroup().addTo(map);
var gastronomie = L.layerGroup().addTo(map);

// Associer les types de chaînes aux couches d'objets pour l'automatisation
const layersMapping = {
    geologie: geologie,
    minier: minier,
    historique: historique,
    naturel: naturel,
    ethno: ethno,
    gastronomie: gastronomie
};

// ================= DATA =================
// Correction de la syntaxe de la structure des données
const sites = [
    {
        nom: "synclinal perché éocène de Dyr El Kef",
        type: "geologie",
        lat: 36.198,
        lng: 8.727,
        couleur: "red",
        description: `Le synclinal perché de Dyr El Kef est une curiosité géologique majeure...`,
        images: ["./images/Eddyr.jpg"],
        url: "https://drive.google.com/file/d/13B__lgAuCyeWWLBnbSm5qsHI62rjniuN/view?usp=sharing"
    },
    {
        nom: "Stratotype K-Pg du Kef",
        type: "geologie",
        lat: 36.153,
        lng: 8.648,
        couleur: "red",
        description: `Le site d’El Kef est mondialement connu pour abriter le stratotype de référence internationale...`,
        images: ["./images/kt.png"],
        url: "https://drive.google.com/file/d/13srHXLY15B5ANww84mHWlnBysQmzWccJ/view?usp=sharing"
    },
    {
        nom: "Série triasque du Débadib",
        type: "geologie",
        lat: 36.175,
        lng: 8.583,
        couleur: "red",
        description: `Les ophites du Trias sont des roches magmatiques basiques...`,
        images: ["./images/ophite.jpg"],
        url: "https://drive.google.com/file/d/1U8Xa0oAe19KB6up6lUMAzQFsg_iE1OZn/view?usp=sharing"
    },
    {
        nom: "Grotte spléologique",
        type: "geologie",
        lat: 36.0299,
        lng: 8.321,
        couleur: "red",
        description: `La grotte du Jebel Harraba présente un karst interne riche en concrétions calcaires...`,
        images: ["./images/grotte.png"],
        url: "https://drive.google.com/file/d/1XI48vuvIVFh9er21EKO03uZO_LbcqOqV/view?usp=sharing"
    },
    {
        nom: "Niveau à Ammonites de l'Aptien Supérieur",
        type: "geologie",
        lat: 35.990,
        lng: 8.350,
        couleur: "red",
        description: `Les ammonites sont des animaux marins fossiles appartenant au groupe des céphalopodes...`,
        images: ["./images/ammonite.jpg"],
        url: "https://drive.google.com/file/d/13qjY9WSQljVTyOCmbYuz7d_NIxCRpHn_/view?usp=sharing"
    },
    {
        nom: "récif aptien du jeble Slata",
        type: "geologie",
        lat: 35.873,
        lng: 8.470,
        couleur: "red",
        description: `Le Jebel Slata est un édifice diapirique triasique...`,
        images: ["./images/slata.jpg"],
        url: "https://drive.google.com/file/d/1AupexraKu_yGd5oGDqvwCfXi-C-MqfDc/view?usp=sharing"
    },
    {
        nom: "Mine de Jerissa",
        type: "minier",
        lat: 35.85,
        lng: 8.63,
        couleur: "blue",
        description: `La Mine de Jerissa est le plus important gisement de minerai de fer...`,
        images: ["./images/galerie.png"],
        url: "https://drive.google.com/file/d/1LO2kPfHMkvd88d4mDUQsYsHZ2oQrECMa/view?usp=sharing"
    },
    {
        nom: "Phosphate de Sra Ouertane",
        type: "minier",
        lat: 35.821,
        lng: 8.767,
        couleur: "blue",
        description: `Le phosphate de Sra Ouertane est l’un des plus grands projets phosphatiers...`,
        images: ["./images/sra.jpg"],
        url: "https://drive.google.com/file/d/1p8fox3qBTJnIh8c2px_pQ74Z7ltTDI7j/view?usp=sharing"
    },
    {
        nom: "Bou Jabeur",
        type: "minier",
        lat: 35.737,
        lng: 8.282,
        couleur: "blue",
        description: `Le site de Bou Jabeur constitue l'un des plus importants gisements polymétalliques...`,
        images: ["./images/boujaber.jpg"],
        url: "https://drive.google.com/file/d/14mVyiJFh2MkW5Cc2nHHhr6nD6JRCOzZ2/view?usp=sharing"
    },
    {
        nom: "Circuit de la Medina du Kef",
        type: "historique",
        lat: 36.18196,
        lng: 8.71269,
        couleur: "orange",
        description: `Le circuit touristique de la Médina du Kef est un itinéraire culturel...`,
        images: ["./images/kasbah.jpg", "./images/boumakhlouf.jpg", "./images/Basilique.jpg"],
        url: "https://www.siccaveneria.com/tourisme/patrimoine/16d5854d-d83a-11ea-af16-0242ac11000b"
    },
    {
        nom: "Sidi Zine",
        type: "historique",
        lat: 36.125,
        lng: 8.634,
        couleur: "orange",
        description: `Le site de Sidi Zine est le site préhistorique le plus important du pays...`,
        images: ["./images/sidi_zine.jpg"], // <-- FIX: Fermeture correcte du tableau et de la chaîne
        url: "#"
    } // <-- FIX: Fermeture correcte de l'objet
];

// ================= GENERATION DES MARQUEURS =================
// Parcourir le tableau pour poser automatiquement les marqueurs sur la carte
sites.forEach(site => {
    // Cibler la bonne couche dynamique (ex: geologie, minier...)
    var targetLayer = layersMapping[site.type];
    
    if (targetLayer) {
        // Création du marqueur standard
        var marker = L.marker([site.lat, site.lng]);
        
        // Construction du contenu de la bulle d'info (Popup)
        var popupContent = `
            <h3>${site.nom}</h3>
            <p>${site.description}</p>
            <a href="${site.url}" target="_blank">Plus d'informations</a>
        `;
        
        marker.bindPopup(popupContent);
        marker.addTo(targetLayer);
    }
});

// ================= INTERACTION SYSTEM =================
// ANCHOR: Fonction pour filtrer et afficher/masquer vos calques au clic
function toggleLayer(layer, button) {
    if (map.hasLayer(layer)) {
        map.removeLayer(layer);
        button.classList.add('inactive');
    } else {
        map.addLayer(layer);
        button.classList.remove('inactive');
    }
}
</script>

</body>
</html>
